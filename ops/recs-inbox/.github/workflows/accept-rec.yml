# Labelling a recommendation issue `accepted` puts a book on the website's
# Want to Read shelf (anything else is noted and closed).
# Source of truth: ops/recs-inbox in the website repo.
name: Accept recommendation

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  accept:
    if: github.event.label.name == 'accepted' && contains(github.event.issue.labels.*.name, 'rec')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/accept-rec.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WEBSITE_TOKEN: ${{ secrets.WEBSITE_TOKEN }}
          WEBSITE_REPO: OmerTexerman/website
